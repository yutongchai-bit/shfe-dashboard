name: Daily SHFE data refresh
on:
  schedule:
    - cron: '45 10 * * 1-5'
  workflow_dispatch:
jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests pandas numpy
      - name: Ensure vendor libs
        run: |
          mkdir -p vendor
          [ -s vendor/chart.umd.js ] || curl -sL -o vendor/chart.umd.js https://cdn.jsdelivr.net/npm/chart.js@4.5.0/dist/chart.umd.js
          [ -s vendor/gridjs.umd.js ] || curl -sL -o vendor/gridjs.umd.js https://cdn.jsdelivr.net/npm/gridjs@5.0.2/dist/gridjs.umd.js
          [ -s vendor/gridjs.css ] || curl -sL -o vendor/gridjs.css https://cdn.jsdelivr.net/npm/gridjs@5.0.2/dist/theme/mermaid.min.css
      - name: Premium scrape (optional)
        run: python premium_update.py || true
      - name: Fetch data and rebuild page
        run: python update_data.py
      - name: Commit and push
        run: |
          git config user.name "auto-refresh"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "daily refresh" || echo "no changes"
          git push
