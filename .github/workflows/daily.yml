name: Daily SHFE data refresh
on:
  schedule:
    - cron: '45 10 * * 1-5'
  workflow_dispatch:
jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests pandas numpy
      - name: Fresh vendor libs (always re-download, verify size)
        run: |
          mkdir -p vendor
          curl -sL --fail -o vendor/chart.umd.js https://cdn.jsdelivr.net/npm/chart.js@4.5.0/dist/chart.umd.js
          curl -sL --fail -o vendor/gridjs.umd.js https://cdn.jsdelivr.net/npm/gridjs@5.0.2/dist/gridjs.umd.js
          curl -sL --fail -o vendor/gridjs.css https://cdn.jsdelivr.net/npm/gridjs@5.0.2/dist/theme/mermaid.min.css
          python3 -c "import os; assert os.path.getsize('vendor/chart.umd.js')>150000, 'chart.js too small'; assert os.path.getsize('vendor/gridjs.umd.js')>30000, 'gridjs too small'"
          ls -la vendor
      - name: Premium scrape (optional)
        run: python premium_update.py || true
      - name: Fetch data and rebuild page
        run: python update_data.py
      - name: Verify page is complete
        run: |
          python3 -c "h=open('index.html',encoding='utf-8').read(); assert len(h)>500000, 'index too small: %d'%len(h); assert 'cdn.jsdelivr.net' not in h, 'CDN tags left in page'; print('index.html OK', len(h)//1024, 'KB')"
      - name: Commit and push
        run: |
          git config user.name "auto-refresh"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "daily refresh" || echo "no changes"
          git push
