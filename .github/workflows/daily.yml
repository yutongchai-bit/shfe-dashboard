name: Daily SHFE data refresh
on:
  schedule:
    - cron: '45 10 * * 1-5'
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas requests
      - name: Repair layout and fetch chart libraries
        run: |
          mkdir -p data scripts vendor
          for f in master_positions.csv master_totals.csv tracked_brokers.json delivery_record.json artifact_baseline.json fresh_board_al.json fresh_board_cu.json fresh_board_zn.json; do
            if [ -f "$f" ]; then mv "$f" data/; fi
          done
          mv fresh_positions_*.csv data/ 2>/dev/null || true
          mv fresh_totals_*.csv data/ 2>/dev/null || true
          if [ -f refresh_pipeline.py ]; then mv refresh_pipeline.py scripts/; fi
          if [ -f artifact_template.html ]; then mv artifact_template.html scripts/; fi
          if [ -f gridjs.umd.js ]; then mv gridjs.umd.js vendor/; fi
          if [ ! -f vendor/chart.umd.js ]; then curl -sL https://cdn.jsdelivr.net/npm/chart.js@4.5.0/dist/chart.umd.js -o vendor/chart.umd.js; fi
          if [ ! -f vendor/gridjs.umd.js ]; then curl -sL https://cdn.jsdelivr.net/npm/gridjs@5.0.2/dist/gridjs.umd.js -o vendor/gridjs.umd.js; fi
          if [ ! -f vendor/gridjs.css ]; then curl -sL https://cdn.jsdelivr.net/npm/gridjs@5.0.2/dist/theme/mermaid.min.css -o vendor/gridjs.css; fi
- name: Update data (non-fatal if source unreachable)
        continue-on-error: true
        run: python update_data.py
      - name: Commit and push
        run: |
          git config user.name "shfe-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Daily refresh $(date -u +%F)"
          git push
