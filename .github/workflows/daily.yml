name: Daily SHFE data refresh
on:
  schedule:
    - cron: '45 10 * * 1-5'   # 10:45 UTC = 18:45 Beijing, after SHFE publishes rankings
  workflow_dispatch: {}        # manual "Run workflow" button
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas requests
      - run: python update_data.py
      - name: Commit and push
        run: |
          git config user.name "shfe-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Daily data refresh $(date -u +%F)"
          git push
